<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Sunetzu — the art of the last layer. Practise all 57 OLL cases, with an adaptive mode that drills whatever you are closest to forgetting. Free, offline, no account."
    />
    <!-- Per-route titles are set by the router; this is the pre-hydration one. -->
    <title>Sunetzu — The Art of the Last Layer</title>
    <script>
      // Applied before first paint so a dark-theme reload does not flash white.
      // Key and shape are defined in docs/PLAN.md §6.
      try {
        var theme = JSON.parse(localStorage.getItem('ollTrainer.v1.settings') || '{}').theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
